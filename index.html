<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Marcador</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: "Open Sans", sans-serif;
      }

      /* 🔥 STAGE BASE (RESOLUCIÓN REAL) */
      .stage {
        position: relative;
        width: 4146px;
        height: 1556px;
        transform-origin: top left;
      }

      /* VIDEO AJUSTADO EXACTO */
      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 4146px;
        height: 1556px;
        object-fit: cover;
        z-index: 0;
      }

      .contenedor-marcador {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .score {
        position: absolute;
        font-size: 158px;
        font-weight: bold;
        color: #ffffff;
      }

      #score-brasil {
        left: 3008px;
        top: 117px;
        transform: translate(-50%, -50%);
      }

      #score-colombia {
        left: 3008px;
        top: 435px;
        transform: translate(-50%, -50%);
      }
      #score-brasil-2 {
        left: 1160px;
        top: 894px;
        transform: translate(-50%, -50%);
      }

      #score-colombia-2 {
        left: 1160px;
        top: 1210px;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>

  <body>
    <div class="stage">
      <video class="video-bg" autoplay muted loop>
        <source src="fondo.mp4" type="video/mp4" />
      </video>

      <div class="contenedor-marcador">
        <div id="score-brasil" class="score">-</div>
        <div id="score-colombia" class="score">-</div>
        <div id="score-brasil-2" class="score">-</div>
        <div id="score-colombia-2" class="score">-</div>
      </div>
    </div>

    <script>
      /* 🔥 ESCALADO AUTOMÁTICO (CLAVE) */
      function escalarStage() {
        const stage = document.querySelector(".stage");

        const scaleX = window.innerWidth / 4146;
        const scaleY = window.innerHeight / 1556;

        const scale = Math.min(scaleX, scaleY);

        stage.style.transform = `scale(${scale})`;
      }

      window.addEventListener("resize", escalarStage);
      window.addEventListener("load", escalarStage);

      /* MARCADOR */
      async function cargarMarcador() {
        try {
          const response = await fetch(
            "https://raw.githubusercontent.com/DannaiCo/Marcador-eliminatoria/main/Fuente%20de%20Marcador.html"
          );
          const contenido = await response.text();

          const tempDiv = document.createElement("div");
          tempDiv.innerHTML = contenido;

          // MARCADOR 1
          const brasil = tempDiv.querySelector("#score-brasil")?.innerText || "-";
          const colombia = tempDiv.querySelector("#score-colombia")?.innerText || "-";

          // 🔥 MARCADOR 2 (LO QUE TE FALTA)
          const brasil2 = tempDiv.querySelector("#score-brasil")?.innerText || "-";
          const colombia2 = tempDiv.querySelector("#score-colombia")?.innerText || "-";

          document.getElementById("score-brasil").innerText = brasil;
          document.getElementById("score-colombia").innerText = colombia;

          document.getElementById("score-brasil-2").innerText = brasil2;
          document.getElementById("score-colombia-2").innerText = colombia2;
        } catch (e) {
          document.getElementById("score-brasil").innerText = "?";
          document.getElementById("score-colombia").innerText = "?";
          document.getElementById("score-brasil-2").innerText = "?";
          document.getElementById("score-colombia-2").innerText = "?";
        }
      }

      cargarMarcador();
    </script>
  </body>
</html>
